<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Passkeys and autofill cover">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#084438"/>
      <stop offset="55%" stop-color="#0f5c4c"/>
      <stop offset="100%" stop-color="#24967c"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(244,250,247,0.07)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="980" cy="140" r="260" fill="rgba(94,184,154,0.22)"/>
  <circle cx="100" cy="520" r="160" fill="rgba(94,184,154,0.1)"/>

  <!-- Browser window -->
  <g transform="translate(100 140)">
    <rect x="0" y="0" width="420" height="320" rx="16" fill="#f4faf7" fill-opacity="0.95"/>
    <rect x="0" y="0" width="420" height="44" rx="16" fill="#0a463a"/>
    <rect x="0" y="28" width="420" height="16" fill="#0a463a"/>
    <circle cx="28" cy="22" r="7" fill="#5eb89a"/>
    <circle cx="52" cy="22" r="7" fill="rgba(244,250,247,0.35)"/>
    <circle cx="76" cy="22" r="7" fill="rgba(244,250,247,0.2)"/>
    <rect x="110" y="12" width="240" height="20" rx="10" fill="rgba(244,250,247,0.15)"/>
    <!-- form fields -->
    <rect x="40" y="80" width="250" height="36" rx="8" fill="#0f5c4c" fill-opacity="0.12"/>
    <rect x="40" y="132" width="250" height="36" rx="8" fill="#0f5c4c" fill-opacity="0.12"/>
    <text x="54" y="104" fill="#0f5c4c" font-family="system-ui, sans-serif" font-size="16" opacity="0.7">you@example.com</text>
    <text x="54" y="156" fill="#0f5c4c" font-family="system-ui, sans-serif" font-size="16" opacity="0.5">""""""""""""</text>
    <!-- autofill popup -->
    <rect x="200" y="170" width="180" height="100" rx="12" fill="#0f5c4c"/>
    <text x="220" y="205" fill="#f4faf7" font-family="system-ui, sans-serif" font-size="15" font-weight="600">OpenKey Autofill</text>
    <text x="220" y="232" fill="rgba(244,250,247,0.75)" font-family="system-ui, sans-serif" font-size="13">example.com login</text>
    <text x="220" y="255" fill="#5eb89a" font-family="system-ui, sans-serif" font-size="13">Passkey ready</text>
  </g>

  <!-- Fingerprint / passkey glyph -->
  <g transform="translate(580 200)" fill="none" stroke="#f4faf7" stroke-width="8" stroke-linecap="round" opacity="0.9">
    <ellipse cx="70" cy="90" rx="55" ry="70"/>
    <ellipse cx="70" cy="95" rx="35" ry="48"/>
    <ellipse cx="70" cy="100" rx="16" ry="26"/>
    <path d="M70 40 V55"/>
  </g>

  <text x="720" y="280" fill="#f4faf7" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="700" letter-spacing="-1">Passkeys &amp;</text>
  <text x="720" y="345" fill="#f4faf7" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="700" letter-spacing="-1">autofill</text>
  <text x="720" y="410" fill="rgba(244,250,247,0.75)" font-family="system-ui, sans-serif" font-size="22">Browser extension that stays</text>
  <text x="720" y="445" fill="rgba(244,250,247,0.75)" font-family="system-ui, sans-serif" font-size="22">zero-knowledge</text>
  <text x="720" y="530" fill="rgba(244,250,247,0.5)" font-family="system-ui, sans-serif" font-size="20" letter-spacing="0.1em">OPENKEY BLOG</text>
</svg>
