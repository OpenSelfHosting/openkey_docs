<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="OpenKey blog cover">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a463a"/>
      <stop offset="55%" stop-color="#0f5c4c"/>
      <stop offset="100%" stop-color="#187a64"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" stop-color="#5eb89a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5eb89a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(244,250,247,0.08)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="980" cy="120" r="260" fill="url(#sheen)"/>
  <circle cx="160" cy="540" r="200" fill="rgba(94,184,154,0.12)"/>

  <!-- Vault glyph -->
  <g transform="translate(140 175)">
    <rect x="0" y="70" width="220" height="180" rx="28" fill="#f4faf7" fill-opacity="0.95"/>
    <path d="M55 70 V42 a55 55 0 0 1 110 0 V70" fill="none" stroke="#f4faf7" stroke-opacity="0.95" stroke-width="22" stroke-linecap="round"/>
    <circle cx="110" cy="155" r="28" fill="#0f5c4c"/>
    <rect x="102" y="155" width="16" height="42" rx="8" fill="#0f5c4c"/>
  </g>

  <text x="420" y="265" fill="#f4faf7" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" letter-spacing="-1.5">Welcome to OpenKey</text>
  <text x="420" y="330" fill="rgba(244,250,247,0.78)" font-family="system-ui, sans-serif" font-size="28">Ciphertext only on the server</text>
  <text x="420" y="500" fill="rgba(244,250,247,0.55)" font-family="system-ui, sans-serif" font-size="22" letter-spacing="0.08em">OPENKEY BLOG</text>
</svg>
