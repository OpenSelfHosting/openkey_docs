<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Self-host your vault cover">
  <defs>
    <linearGradient id="bg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a3d34"/>
      <stop offset="45%" stop-color="#126352"/>
      <stop offset="100%" stop-color="#1d9076"/>
    </linearGradient>
    <linearGradient id="roof" x1="0%" y1="0%" x2="0%" y2="1">
      <stop offset="0%" stop-color="#f4faf7"/>
      <stop offset="100%" stop-color="#c8e8dc"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(244,250,247,0.07)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="180" cy="100" r="220" fill="rgba(94,184,154,0.18)"/>
  <circle cx="1100" cy="500" r="240" fill="rgba(94,184,154,0.1)"/>

  <!-- House / self-hosted server -->
  <g transform="translate(130 160)">
    <polygon points="150,20 280,120 20,120" fill="url(#roof)"/>
    <rect x="40" y="120" width="220" height="180" rx="8" fill="#f4faf7" fill-opacity="0.95"/>
    <!-- door -->
    <rect x="120" y="200" width="60" height="100" rx="6" fill="#0f5c4c"/>
    <circle cx="165" cy="250" r="5" fill="#5eb89a"/>
    <!-- window with vault -->
    <rect x="60" y="150" width="48" height="40" rx="4" fill="#0f5c4c"/>
    <rect x="192" y="150" width="48" height="40" rx="4" fill="#0f5c4c"/>
    <!-- server rack lines -->
    <rect x="70" y="210" width="36" height="8" rx="2" fill="#5eb89a" opacity="0.7"/>
    <rect x="70" y="224" width="36" height="8" rx="2" fill="#5eb89a" opacity="0.5"/>
    <rect x="70" y="238" width="36" height="8" rx="2" fill="#5eb89a" opacity="0.35"/>
  </g>

  <!-- Connected devices orbit -->
  <g fill="#5eb89a">
    <circle cx="420" cy="200" r="10" opacity="0.9"/>
    <circle cx="450" cy="320" r="8" opacity="0.6"/>
    <circle cx="380" cy="400" r="9" opacity="0.75"/>
  </g>
  <path d="M300 300 Q380 250 420 200" fill="none" stroke="rgba(244,250,247,0.3)" stroke-width="2" stroke-dasharray="6 8"/>
  <path d="M300 300 Q400 340 450 320" fill="none" stroke="rgba(244,250,247,0.25)" stroke-width="2" stroke-dasharray="6 8"/>
  <path d="M300 300 Q340 380 380 400" fill="none" stroke="rgba(244,250,247,0.25)" stroke-width="2" stroke-dasharray="6 8"/>

  <text x="520" y="260" fill="#f4faf7" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="700" letter-spacing="-1.5">Self-host</text>
  <text x="520" y="330" fill="#f4faf7" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="700" letter-spacing="-1.5">your vault</text>
  <text x="520" y="400" fill="rgba(244,250,247,0.75)" font-family="system-ui, sans-serif" font-size="24">Your server. Your rules.</text>
  <text x="520" y="520" fill="rgba(244,250,247,0.5)" font-family="system-ui, sans-serif" font-size="20" letter-spacing="0.1em">OPENKEY BLOG</text>
</svg>
