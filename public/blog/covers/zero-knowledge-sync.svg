<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Zero-knowledge sync cover">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06352c"/>
      <stop offset="50%" stop-color="#0f5c4c"/>
      <stop offset="100%" stop-color="#1a8a70"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" stop-color="#5eb89a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#5eb89a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(244,250,247,0.07)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="1040" cy="80" r="280" fill="url(#sheen)"/>
  <circle cx="80" cy="560" r="180" fill="rgba(94,184,154,0.1)"/>

  <!-- Phone (client) -->
  <g transform="translate(110 150)">
    <rect x="0" y="0" width="130" height="240" rx="22" fill="#f4faf7" fill-opacity="0.95"/>
    <rect x="14" y="28" width="102" height="160" rx="8" fill="#0f5c4c"/>
    <circle cx="65" cy="210" r="12" fill="#0f5c4c" fill-opacity="0.35"/>
    <!-- lock on screen -->
    <rect x="42" y="95" width="46" height="38" rx="6" fill="#5eb89a"/>
    <path d="M52 95 V82 a13 13 0 0 1 26 0 V95" fill="none" stroke="#5eb89a" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Encrypted packets flowing -->
  <g fill="#5eb89a" opacity="0.9">
    <rect x="280" y="230" width="56" height="28" rx="6"/>
    <rect x="360" y="270" width="56" height="28" rx="6" opacity="0.65"/>
    <rect x="440" y="230" width="56" height="28" rx="6" opacity="0.85"/>
  </g>
  <path d="M270 255 H520" fill="none" stroke="rgba(244,250,247,0.35)" stroke-width="3" stroke-dasharray="8 10"/>

  <!-- Server (opaque boxes only) -->
  <g transform="translate(560 175)">
    <rect x="0" y="0" width="160" height="200" rx="18" fill="rgba(244,250,247,0.12)" stroke="rgba(244,250,247,0.45)" stroke-width="3"/>
    <rect x="24" y="36" width="112" height="22" rx="5" fill="rgba(244,250,247,0.25)"/>
    <rect x="24" y="72" width="112" height="22" rx="5" fill="rgba(244,250,247,0.18)"/>
    <rect x="24" y="108" width="112" height="22" rx="5" fill="rgba(244,250,247,0.25)"/>
    <rect x="24" y="144" width="112" height="22" rx="5" fill="rgba(244,250,247,0.15)"/>
    <text x="80" y="190" text-anchor="middle" fill="rgba(244,250,247,0.55)" font-family="system-ui, sans-serif" font-size="14" letter-spacing="0.06em">CIPHERTEXT</text>
  </g>

  <text x="780" y="265" fill="#f4faf7" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="700" letter-spacing="-1">Zero-knowledge</text>
  <text x="780" y="330" fill="#f4faf7" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="700" letter-spacing="-1">sync</text>
  <text x="780" y="395" fill="rgba(244,250,247,0.75)" font-family="system-ui, sans-serif" font-size="24">The server never sees plaintext</text>
  <text x="780" y="520" fill="rgba(244,250,247,0.5)" font-family="system-ui, sans-serif" font-size="20" letter-spacing="0.1em">OPENKEY BLOG</text>
</svg>
