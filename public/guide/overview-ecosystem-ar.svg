<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" role="img" aria-labelledby="title desc">
  <title id="title">منظومة OpenKey</title>
  <desc id="desc">العملاء يشفّرون محلياً. المزامنة الاختيارية عبر خادم مستضاف ذاتياً كنص مشفّر، أو Nearby على الشبكة المحلية بين أجهزة مقترنة.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4faf7"/>
      <stop offset="100%" stop-color="#e6f4ee"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0d5445" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#187a64"/>
    </marker>
  </defs>
  <rect width="920" height="440" rx="20" fill="url(#bg)"/>
  <rect x="16" y="16" width="888" height="408" rx="16" fill="none" stroke="#c5e4d7" stroke-width="1.5"/>

  <text x="460" y="48" text-anchor="middle" fill="#0d5445" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="700">العملاء يشفّرون قبل أن تغادر أي بيانات الجهاز</text>

  <!-- App -->
  <g filter="url(#shadow)">
    <rect x="340" y="72" width="240" height="88" rx="14" fill="#0d5445"/>
    <text x="460" y="110" text-anchor="middle" fill="#f4faf7" font-family="system-ui,Segoe UI,sans-serif" font-size="20" font-weight="700">تطبيق OpenKey</text>
    <text x="460" y="136" text-anchor="middle" fill="#a8dcc9" font-family="system-ui,Segoe UI,sans-serif" font-size="13">جوال · سطح مكتب · خزنة محلية</text>
  </g>

  <!-- Extension -->
  <g filter="url(#shadow)">
    <rect x="48" y="200" width="200" height="86" rx="14" fill="#ffffff" stroke="#187a64" stroke-width="2"/>
    <text x="148" y="236" text-anchor="middle" fill="#0d5445" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="700">امتداد المتصفح</text>
    <text x="148" y="262" text-anchor="middle" fill="#3d6b5c" font-family="system-ui,Segoe UI,sans-serif" font-size="12">تعبئة · مفاتيح مرور · جسر</text>
  </g>

  <!-- CLI -->
  <g filter="url(#shadow)">
    <rect x="672" y="200" width="200" height="86" rx="14" fill="#ffffff" stroke="#187a64" stroke-width="2"/>
    <text x="772" y="236" text-anchor="middle" fill="#0d5445" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="700">CLI</text>
    <text x="772" y="262" text-anchor="middle" fill="#3d6b5c" font-family="system-ui,Segoe UI,sans-serif" font-size="12">أسرار · توليد · مزامنة</text>
  </g>

  <!-- Server -->
  <g filter="url(#shadow)">
    <rect x="200" y="330" width="220" height="78" rx="14" fill="#ffffff" stroke="#187a64" stroke-width="2"/>
    <text x="310" y="364" text-anchor="middle" fill="#0d5445" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700">خادم مستضاف ذاتياً</text>
    <text x="310" y="388" text-anchor="middle" fill="#5eb89a" font-family="ui-monospace,Menlo,monospace" font-size="12">نص مشفّر فقط</text>
  </g>

  <!-- Nearby -->
  <g filter="url(#shadow)">
    <rect x="500" y="330" width="220" height="78" rx="14" fill="#ffffff" stroke="#5eb89a" stroke-width="2"/>
    <text x="610" y="364" text-anchor="middle" fill="#0d5445" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700">Nearby (Pro)</text>
    <text x="610" y="388" text-anchor="middle" fill="#3d6b5c" font-family="system-ui,Segoe UI,sans-serif" font-size="12">اقتران LAN · ربط · مزامنة</text>
  </g>

  <path d="M360 160 C280 180, 220 190, 180 200" fill="none" stroke="#187a64" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M560 160 C640 180, 700 190, 740 200" fill="none" stroke="#187a64" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M420 160 C360 240, 340 300, 310 330" fill="none" stroke="#187a64" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M500 160 C560 240, 580 300, 610 330" fill="none" stroke="#5eb89a" stroke-width="2.5" marker-end="url(#arrow)"/>

  <text x="230" y="178" fill="#0d5445" font-family="system-ui,Segoe UI,sans-serif" font-size="11" font-weight="600">محلي / مستقل</text>
  <text x="640" y="178" fill="#0d5445" font-family="system-ui,Segoe UI,sans-serif" font-size="11" font-weight="600">جسر / جلسة</text>
  <text x="250" y="280" fill="#0d5445" font-family="system-ui,Segoe UI,sans-serif" font-size="11" font-weight="600">مزامنة اختيارية</text>
  <text x="560" y="280" fill="#0d5445" font-family="system-ui,Segoe UI,sans-serif" font-size="11" font-weight="600">بدون خادم</text>
</svg>
