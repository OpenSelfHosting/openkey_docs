<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" role="img" aria-labelledby="title desc">
  <title id="title">تغليف مفاتيح المشاركة والمنظمات</title>
  <desc id="desc">ينشر المستخدمون مفاتيح الهوية. دعوات المنظمة تلفّ مفتاح المنظمة للمستلم. مشاركات العناصر تلفّ لقطة من النص المشفّر. الخادم يخزّن كتلاً غير شفافة فقط.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4faf7"/>
      <stop offset="100%" stop-color="#e6f4ee"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0d5445" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#187a64"/>
    </marker>
  </defs>
  <rect width="920" height="400" rx="20" fill="url(#bg)"/>
  <rect x="16" y="16" width="888" height="368" rx="16" fill="none" stroke="#c5e4d7" stroke-width="1.5"/>

  <!-- You -->
  <g filter="url(#shadow)">
    <rect x="48" y="60" width="200" height="100" rx="14" fill="#0d5445"/>
    <text x="148" y="105" text-anchor="middle" fill="#f4faf7" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="700">أنت (المالك)</text>
    <text x="148" y="132" text-anchor="middle" fill="#a8dcc9" font-family="system-ui,Segoe UI,sans-serif" font-size="12">نشر مفاتيح الهوية</text>
  </g>

  <!-- المستلم -->
  <g filter="url(#shadow)">
    <rect x="672" y="60" width="200" height="100" rx="14" fill="#ffffff" stroke="#187a64" stroke-width="2"/>
    <text x="772" y="105" text-anchor="middle" fill="#0d5445" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="700">المستلم</text>
    <text x="772" y="132" text-anchor="middle" fill="#3d6b5c" font-family="system-ui,Segoe UI,sans-serif" font-size="12">نفس الخادم · مفاتيح الهوية</text>
  </g>

  <!-- Server -->
  <g filter="url(#shadow)">
    <rect x="320" y="48" width="280" height="80" rx="14" fill="#ffffff" stroke="#5eb89a" stroke-width="2"/>
    <text x="460" y="82" text-anchor="middle" fill="#0d5445" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700">خادم مستضاف ذاتياً</text>
    <text x="460" y="106" text-anchor="middle" fill="#5eb89a" font-family="system-ui,Segoe UI,sans-serif" font-size="12">كتل غير شفافة · لا يفك التشفير</text>
  </g>

  <!-- Org path -->
  <g filter="url(#shadow)">
    <rect x="80" y="210" width="340" height="140" rx="14" fill="#ffffff" stroke="#187a64" stroke-width="2"/>
    <text x="250" y="248" text-anchor="middle" fill="#0d5445" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700">دعوة منظمة</text>
    <text x="250" y="278" text-anchor="middle" fill="#3d6b5c" font-family="system-ui,Segoe UI,sans-serif" font-size="13">١. إنشاء منظمة + مفتاحها</text>
    <text x="250" y="302" text-anchor="middle" fill="#3d6b5c" font-family="system-ui,Segoe UI,sans-serif" font-size="13">٢. تغليف مفتاح المنظمة للمستلم</text>
    <text x="250" y="326" text-anchor="middle" fill="#5eb89a" font-family="system-ui,Segoe UI,sans-serif" font-size="12">مجموعات مشتركة حية بعد القبول</text>
  </g>

  <!-- Share path -->
  <g filter="url(#shadow)">
    <rect x="500" y="210" width="340" height="140" rx="14" fill="#ffffff" stroke="#5eb89a" stroke-width="2"/>
    <text x="670" y="248" text-anchor="middle" fill="#0d5445" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700">مشاركة عنصر</text>
    <text x="670" y="278" text-anchor="middle" fill="#3d6b5c" font-family="system-ui,Segoe UI,sans-serif" font-size="13">١. تغليف مفتاح العنصر للمستلم</text>
    <text x="670" y="302" text-anchor="middle" fill="#3d6b5c" font-family="system-ui,Segoe UI,sans-serif" font-size="13">٢. لقطة نص مشفّر وقت المشاركة</text>
    <text x="670" y="326" text-anchor="middle" fill="#5eb89a" font-family="system-ui,Segoe UI,sans-serif" font-size="12">Frozen copy  not a live document</text>
  </g>

  <path d="M248 110 L320 88" fill="none" stroke="#187a64" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M600 88 L672 110" fill="none" stroke="#187a64" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M148 160 L200 210" fill="none" stroke="#187a64" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M772 160 L720 210" fill="none" stroke="#5eb89a" stroke-width="2.5" marker-end="url(#arrow)"/>
</svg>
