<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" role="img" aria-labelledby="title desc">
  <title id="title">أوضاع فتح امتداد المتصفح</title>
  <desc id="desc">الوضع المستقل يفتح مقابل الخادم المستضاف ذاتياً ويزامن النص المشفّر. وضع الجسر يملأ عبر تطبيق سطح المكتب المفتوح برسائل أصلية دون فتح خزنة منفصلة.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4faf7"/>
      <stop offset="100%" stop-color="#e6f4ee"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0d5445" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#187a64"/>
    </marker>
  </defs>
  <rect width="920" height="400" rx="20" fill="url(#bg)"/>
  <rect x="16" y="16" width="888" height="368" rx="16" fill="none" stroke="#c5e4d7" stroke-width="1.5"/>

  <!-- Extension center -->
  <g filter="url(#shadow)">
    <rect x="340" y="40" width="240" height="72" rx="14" fill="#0d5445"/>
    <text x="460" y="72" text-anchor="middle" fill="#f4faf7" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700">امتداد المتصفح</text>
    <text x="460" y="96" text-anchor="middle" fill="#a8dcc9" font-family="system-ui,Segoe UI,sans-serif" font-size="12">تعبئة · حفظ · مفاتيح مرور</text>
  </g>

  <!-- الوضع أ -->
  <g filter="url(#shadow)">
    <rect x="40" y="160" width="380" height="200" rx="16" fill="#ffffff" stroke="#187a64" stroke-width="2"/>
    <rect x="56" y="176" width="140" height="28" rx="14" fill="#0d5445"/>
    <text x="126" y="195" text-anchor="middle" fill="#f4faf7" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700">الوضع أ</text>
    <text x="230" y="220" text-anchor="middle" fill="#0d5445" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="700">خادم مستضاف ذاتياً</text>
    <text x="230" y="248" text-anchor="middle" fill="#3d6b5c" font-family="system-ui,Segoe UI,sans-serif" font-size="13">فتح بالبريد وكلمة المرور الرئيسية</text>
    <text x="230" y="276" text-anchor="middle" fill="#3d6b5c" font-family="system-ui,Segoe UI,sans-serif" font-size="13">مزامنة النص المشفّر عبر POST /sync</text>
    <text x="230" y="304" text-anchor="middle" fill="#5eb89a" font-family="system-ui,Segoe UI,sans-serif" font-size="12">خزنة مستقلة داخل الامتداد</text>
    <text x="230" y="332" text-anchor="middle" fill="#0d5445" font-family="ui-monospace,Menlo,monospace" font-size="12">auth_hash · JWT · LWW</text>
  </g>

  <!-- الوضع ب -->
  <g filter="url(#shadow)">
    <rect x="500" y="160" width="380" height="200" rx="16" fill="#ffffff" stroke="#5eb89a" stroke-width="2"/>
    <rect x="516" y="176" width="140" height="28" rx="14" fill="#5eb89a"/>
    <text x="586" y="195" text-anchor="middle" fill="#0d5445" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700">الوضع ب</text>
    <text x="690" y="220" text-anchor="middle" fill="#0d5445" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="700">جسر تطبيق سطح المكتب</text>
    <text x="690" y="248" text-anchor="middle" fill="#3d6b5c" font-family="system-ui,Segoe UI,sans-serif" font-size="13">أبقِ تطبيق سطح المكتب مفتوحاً</text>
    <text x="690" y="276" text-anchor="middle" fill="#3d6b5c" font-family="system-ui,Segoe UI,sans-serif" font-size="13">مضيف الرسائل الأصلية يملأ / يحفظ</text>
    <text x="690" y="304" text-anchor="middle" fill="#5eb89a" font-family="system-ui,Segoe UI,sans-serif" font-size="12">بدون فتح منفصل للامتداد</text>
    <text x="690" y="332" text-anchor="middle" fill="#0d5445" font-family="ui-monospace,Menlo,monospace" font-size="12">com.openselfhosting.openkey</text>
  </g>

  <path d="M400 112 C320 130, 280 150, 230 160" fill="none" stroke="#187a64" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M520 112 C600 130, 640 150, 690 160" fill="none" stroke="#5eb89a" stroke-width="2.5" marker-end="url(#arrow)"/>
</svg>
