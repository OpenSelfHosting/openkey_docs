<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" role="img" aria-labelledby="title desc">
  <title id="title">طوبولوجيا مزامنة خادم OpenKey</title>
  <desc id="desc">التطبيق والامتداد وCLI يصادقون بـ auth_hash ثم يزامنون نصاً مشفّراً عبر FastAPI إلى PostgreSQL. الخادم لا يرى مفاتيح أو حمولات صريحة.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4faf7"/>
      <stop offset="100%" stop-color="#e6f4ee"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0d5445" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#187a64"/>
    </marker>
  </defs>
  <rect width="920" height="400" rx="20" fill="url(#bg)"/>
  <rect x="16" y="16" width="888" height="368" rx="16" fill="none" stroke="#c5e4d7" stroke-width="1.5"/>

  <text x="460" y="48" text-anchor="middle" fill="#0d5445" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700">Zero-knowledge sync  نص مشفّر in, نص مشفّر out</text>

  <!-- Clients -->
  <g filter="url(#shadow)">
    <rect x="48" y="80" width="180" height="72" rx="12" fill="#ffffff" stroke="#187a64" stroke-width="2"/>
    <text x="138" y="112" text-anchor="middle" fill="#0d5445" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700">التطبيق</text>
    <text x="138" y="134" text-anchor="middle" fill="#3d6b5c" font-family="system-ui,Segoe UI,sans-serif" font-size="12">تشفير على الجهاز</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="48" y="172" width="180" height="72" rx="12" fill="#ffffff" stroke="#187a64" stroke-width="2"/>
    <text x="138" y="204" text-anchor="middle" fill="#0d5445" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700">الامتداد</text>
    <text x="138" y="226" text-anchor="middle" fill="#3d6b5c" font-family="system-ui,Segoe UI,sans-serif" font-size="12">فتح مستقل</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="48" y="264" width="180" height="72" rx="12" fill="#ffffff" stroke="#187a64" stroke-width="2"/>
    <text x="138" y="296" text-anchor="middle" fill="#0d5445" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700">CLI</text>
    <text x="138" y="318" text-anchor="middle" fill="#3d6b5c" font-family="system-ui,Segoe UI,sans-serif" font-size="12">مزامنة الجلسة</text>
  </g>

  <!-- API -->
  <g filter="url(#shadow)">
    <rect x="340" y="140" width="240" height="120" rx="14" fill="#0d5445"/>
    <text x="460" y="186" text-anchor="middle" fill="#f4faf7" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700">openkey_server</text>
    <text x="460" y="212" text-anchor="middle" fill="#a8dcc9" font-family="ui-monospace,Menlo,monospace" font-size="13">FastAPI · JWT · /sync</text>
    <text x="460" y="236" text-anchor="middle" fill="#5eb89a" font-family="system-ui,Segoe UI,sans-serif" font-size="12">auth_hash · مراجعات LWW</text>
  </g>

  <!-- DB -->
  <g filter="url(#shadow)">
    <rect x="680" y="152" width="200" height="96" rx="14" fill="#ffffff" stroke="#187a64" stroke-width="2"/>
    <text x="780" y="192" text-anchor="middle" fill="#0d5445" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="700">PostgreSQL</text>
    <text x="780" y="218" text-anchor="middle" fill="#3d6b5c" font-family="system-ui,Segoe UI,sans-serif" font-size="12">صفوف غير شفافة فقط</text>
  </g>

  <path d="M228 116 L340 180" fill="none" stroke="#187a64" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M228 208 L340 200" fill="none" stroke="#187a64" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M228 300 L340 230" fill="none" stroke="#187a64" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M580 200 L680 200" fill="none" stroke="#187a64" stroke-width="2.5" marker-end="url(#arrow)"/>

  <text x="260" y="88" fill="#0d5445" font-family="system-ui,Segoe UI,sans-serif" font-size="11" font-weight="600">HTTPS · JWT</text>
  <text x="600" y="180" fill="#0d5445" font-family="system-ui,Segoe UI,sans-serif" font-size="11" font-weight="600">نص مشفّر</text>

  <rect x="340" y="340" width="240" height="36" rx="18" fill="#ffffff" stroke="#5eb89a" stroke-width="1.5"/>
  <text x="460" y="363" text-anchor="middle" fill="#0d5445" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="600">الخادم لا يستطيع فك تشفير بيانات الخزنة</text>
</svg>
