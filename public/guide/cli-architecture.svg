<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">OpenKey CLI architecture</title>
  <desc id="desc">CLI can talk to the unlocked desktop app over a local bridge, or to a self-hosted server for ciphertext sync and a short session.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4faf7"/>
      <stop offset="100%" stop-color="#e6f4ee"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0d5445" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#187a64"/>
    </marker>
  </defs>
  <rect width="920" height="420" rx="20" fill="url(#bg)"/>
  <rect x="16" y="16" width="888" height="388" rx="16" fill="none" stroke="#c5e4d7" stroke-width="1.5"/>

  <!-- CLI box -->
  <g filter="url(#shadow)">
    <rect x="360" y="150" width="200" height="100" rx="14" fill="#0d5445"/>
    <text x="460" y="195" text-anchor="middle" fill="#f4faf7" font-family="system-ui,Segoe UI,sans-serif" font-size="22" font-weight="700">openkey CLI</text>
    <text x="460" y="222" text-anchor="middle" fill="#a8dcc9" font-family="ui-monospace,Menlo,monospace" font-size="13">terminal</text>
  </g>

  <!-- Desktop app -->
  <g filter="url(#shadow)">
    <rect x="60" y="60" width="220" height="110" rx="14" fill="#ffffff" stroke="#187a64" stroke-width="2"/>
    <text x="170" y="105" text-anchor="middle" fill="#0d5445" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700">Desktop app</text>
    <text x="170" y="132" text-anchor="middle" fill="#3d6b5c" font-family="system-ui,Segoe UI,sans-serif" font-size="13">unlocked vault</text>
  </g>

  <!-- Local machine sources -->
  <g filter="url(#shadow)">
    <rect x="60" y="250" width="220" height="110" rx="14" fill="#ffffff" stroke="#5eb89a" stroke-width="2"/>
    <text x="170" y="290" text-anchor="middle" fill="#0d5445" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="700">This machine</text>
    <text x="170" y="318" text-anchor="middle" fill="#3d6b5c" font-family="system-ui,Segoe UI,sans-serif" font-size="12">~/.ssh � .env � env � AWS</text>
  </g>

  <!-- Server -->
  <g filter="url(#shadow)">
    <rect x="640" y="140" width="230" height="120" rx="14" fill="#ffffff" stroke="#187a64" stroke-width="2"/>
    <text x="755" y="185" text-anchor="middle" fill="#0d5445" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700">Self-hosted server</text>
    <text x="755" y="212" text-anchor="middle" fill="#3d6b5c" font-family="system-ui,Segoe UI,sans-serif" font-size="13">ciphertext only</text>
    <text x="755" y="235" text-anchor="middle" fill="#5eb89a" font-family="ui-monospace,Menlo,monospace" font-size="12">login � sync � unlock</text>
  </g>

  <!-- Arrows -->
  <path d="M360 175 C300 140, 300 110, 280 110" fill="none" stroke="#187a64" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="300" y="95" fill="#0d5445" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="600">native bridge</text>

  <path d="M360 230 C300 270, 300 300, 280 300" fill="none" stroke="#5eb89a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="292" y="275" fill="#0d5445" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="600">discover</text>

  <path d="M560 200 L640 200" fill="none" stroke="#187a64" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="575" y="188" fill="#0d5445" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="600">optional sync</text>

  <!-- Offline badge -->
  <rect x="390" y="40" width="140" height="36" rx="18" fill="#ffffff" stroke="#5eb89a" stroke-width="1.5"/>
  <text x="460" y="63" text-anchor="middle" fill="#0d5445" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="600">gen = offline</text>
  <path d="M460 76 L460 150" fill="none" stroke="#5eb89a" stroke-width="2" stroke-dasharray="4 4"/>
</svg>
