<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" role="img" aria-labelledby="title desc">
  <title id="title">اشتقاق مفاتيح OpenKey</title>
  <desc id="desc">Argon2id يشتق مفتاحاً رئيسياً من البريد وكلمة المرور. ينتج تجزئة مصادقة للخادم ويلفّ مفتاح الخزنة لتشفير AES-256-GCM. كلمة المرور لا تغادر الجهاز.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4faf7"/>
      <stop offset="100%" stop-color="#e6f4ee"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0d5445" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#187a64"/>
    </marker>
  </defs>
  <rect width="920" height="400" rx="20" fill="url(#bg)"/>
  <rect x="16" y="16" width="888" height="368" rx="16" fill="none" stroke="#c5e4d7" stroke-width="1.5"/>

  <!-- Inputs -->
  <g filter="url(#shadow)">
    <rect x="40" y="48" width="200" height="70" rx="12" fill="#ffffff" stroke="#5eb89a" stroke-width="2"/>
    <text x="140" y="78" text-anchor="middle" fill="#0d5445" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="700">البريد</text>
    <text x="140" y="100" text-anchor="middle" fill="#3d6b5c" font-family="system-ui,Segoe UI,sans-serif" font-size="12">+ كلمة المرور الرئيسية</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="40" y="140" width="200" height="56" rx="12" fill="#ffffff" stroke="#c5e4d7" stroke-width="1.5"/>
    <text x="140" y="174" text-anchor="middle" fill="#3d6b5c" font-family="ui-monospace,Menlo,monospace" font-size="13">ملح · معاملات KDF</text>
  </g>

  <!-- Argon2id -->
  <g filter="url(#shadow)">
    <rect x="300" y="88" width="200" height="88" rx="14" fill="#0d5445"/>
    <text x="400" y="128" text-anchor="middle" fill="#f4faf7" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700">Argon2id</text>
    <text x="400" y="152" text-anchor="middle" fill="#a8dcc9" font-family="system-ui,Segoe UI,sans-serif" font-size="13">المفتاح الرئيسي (الجهاز)</text>
  </g>

  <!-- تجزئة المصادقة -->
  <g filter="url(#shadow)">
    <rect x="580" y="40" width="300" height="88" rx="14" fill="#ffffff" stroke="#187a64" stroke-width="2"/>
    <text x="730" y="76" text-anchor="middle" fill="#0d5445" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700">تجزئة المصادقة</text>
    <text x="730" y="102" text-anchor="middle" fill="#3d6b5c" font-family="system-ui,Segoe UI,sans-serif" font-size="12">تُرسل للخادم لتسجيل الدخول فقط</text>
  </g>

  <!-- Vault key -->
  <g filter="url(#shadow)">
    <rect x="580" y="160" width="300" height="88" rx="14" fill="#ffffff" stroke="#187a64" stroke-width="2"/>
    <text x="730" y="196" text-anchor="middle" fill="#0d5445" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700">مفتاح الخزنة (ملفوف)</text>
    <text x="730" y="222" text-anchor="middle" fill="#3d6b5c" font-family="system-ui,Segoe UI,sans-serif" font-size="12">لا يظهر كنص صريح على الخادم</text>
  </g>

  <!-- AES -->
  <g filter="url(#shadow)">
    <rect x="300" y="280" width="580" height="80" rx="14" fill="#ffffff" stroke="#5eb89a" stroke-width="2"/>
    <text x="590" y="316" text-anchor="middle" fill="#0d5445" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="700">نص مشفّر AES-256-GCM</text>
    <text x="590" y="340" text-anchor="middle" fill="#3d6b5c" font-family="system-ui,Segoe UI,sans-serif" font-size="12">أسماء · حمولات · مرفقات · منظمات · مشاركات</text>
  </g>

  <!-- Device badge -->
  <rect x="40" y="280" width="200" height="80" rx="14" fill="#0d5445"/>
  <text x="140" y="316" text-anchor="middle" fill="#f4faf7" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700">يبقى على الجهاز</text>
  <text x="140" y="340" text-anchor="middle" fill="#a8dcc9" font-family="system-ui,Segoe UI,sans-serif" font-size="12">كلمة المرور الرئيسية</text>

  <path d="M240 83 L300 120" fill="none" stroke="#187a64" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M240 168 L300 140" fill="none" stroke="#5eb89a" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M500 110 L580 84" fill="none" stroke="#187a64" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M500 150 L580 200" fill="none" stroke="#187a64" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M730 248 L730 280" fill="none" stroke="#5eb89a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M400 176 L400 280" fill="none" stroke="#5eb89a" stroke-width="2.5" marker-end="url(#arrow)"/>
</svg>
