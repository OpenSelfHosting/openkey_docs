<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" role="img" aria-labelledby="title desc">
  <title id="title">Server login and unlock flow</title>
  <desc id="desc">Login authenticates with auth_hash, pulls ciphertext, then unlock exports OPENKEY_SESSION for vault commands.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4faf7"/>
      <stop offset="100%" stop-color="#e6f4ee"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#187a64"/>
    </marker>
  </defs>
  <rect width="920" height="340" rx="20" fill="url(#bg)"/>
  <rect x="16" y="16" width="888" height="308" rx="16" fill="none" stroke="#c5e4d7" stroke-width="1.5"/>

  <rect x="40" y="50" width="150" height="70" rx="12" fill="#ffffff" stroke="#187a64" stroke-width="2"/>
  <text x="115" y="80" text-anchor="middle" fill="#0d5445" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700">config</text>
  <text x="115" y="100" text-anchor="middle" fill="#3d6b5c" font-family="ui-monospace,Menlo,monospace" font-size="11">set-server</text>

  <path d="M190 85 L240 85" stroke="#187a64" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="240" y="50" width="150" height="70" rx="12" fill="#ffffff" stroke="#187a64" stroke-width="2"/>
  <text x="315" y="80" text-anchor="middle" fill="#0d5445" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700">login</text>
  <text x="315" y="100" text-anchor="middle" fill="#3d6b5c" font-family="system-ui,Segoe UI,sans-serif" font-size="11">Argon2id � auth_hash</text>

  <path d="M390 85 L440 85" stroke="#187a64" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="440" y="40" width="170" height="90" rx="12" fill="#0d5445"/>
  <text x="525" y="75" text-anchor="middle" fill="#f4faf7" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700">Server</text>
  <text x="525" y="98" text-anchor="middle" fill="#a8dcc9" font-family="system-ui,Segoe UI,sans-serif" font-size="11">JWT + wrapped key</text>
  <text x="525" y="116" text-anchor="middle" fill="#5eb89a" font-family="system-ui,Segoe UI,sans-serif" font-size="11">ciphertext pull</text>

  <path d="M525 130 L525 170" stroke="#187a64" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="440" y="170" width="170" height="70" rx="12" fill="#ffffff" stroke="#5eb89a" stroke-width="2"/>
  <text x="525" y="200" text-anchor="middle" fill="#0d5445" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700">Local cache</text>
  <text x="525" y="222" text-anchor="middle" fill="#3d6b5c" font-family="system-ui,Segoe UI,sans-serif" font-size="11">encrypted entries</text>

  <path d="M610 205 L660 205" stroke="#187a64" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="660" y="170" width="200" height="70" rx="12" fill="#187a64"/>
  <text x="760" y="200" text-anchor="middle" fill="#f4faf7" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700">eval $(unlock)</text>
  <text x="760" y="222" text-anchor="middle" fill="#d5f0e6" font-family="ui-monospace,Menlo,monospace" font-size="11">OPENKEY_SESSION</text>

  <path d="M760 240 L760 275 L315 275 L315 120" fill="none" stroke="#5eb89a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="500" y="268" fill="#0d5445" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="600">then: secret � discover � sync � get</text>

  <text x="40" y="300" fill="#3d6b5c" font-family="system-ui,Segoe UI,sans-serif" font-size="12">Master password stays on the client. The server never receives vault plaintext.</text>
</svg>
